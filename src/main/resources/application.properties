
 
spring.application.name=contenthub-backend
 
# ---------------- Server ----------------
# Render / Cloud injects PORT at runtime; 8080 is local-dev fallback.
server.port=${PORT:8080}
server.tomcat.threads.max=50
server.tomcat.threads.min-spare=5
server.tomcat.accept-count=100
server.tomcat.connection-timeout=20000
 
# ---------------- Database (MySQL) ----------------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/contenthub?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false
spring.sql.init.mode=never

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.pool-name=KdpCloudHikariPool

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=1024MB
spring.servlet.multipart.max-request-size=1100MB
app.upload.base-dir=${UPLOAD_DIR:uploads}
 
# ---------------- JWT ----------------
app.jwt.secret=${JWT_SECRET:98f6d73c89a0b12c34d56e78f90123456789abcdef0123456789abcdef012345}
app.jwt.user-expiration-ms=315360000000
app.jwt.admin-expiration-ms=43200000
 
# ---------------- Hardcoded admin login ----------------
app.admin.email=${ADMIN_EMAIL:admin@kdpcloud.com}
app.admin.password=${ADMIN_PASSWORD:Admin@1234}
 
# ---------------- Mail (Gmail SMTP) ----------------
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:noreply@kdpcloud.com}
spring.mail.password=${MAIL_PASSWORD:password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=8000
spring.mail.properties.mail.smtp.timeout=8000
app.mail.from=${MAIL_USERNAME:noreply@kdpcloud.com}
app.otp.expiry-minutes=5
 
# ---------------- Razorpay ----------------
# Platform Razorpay Keys (All sales go here, 3% commission retained, 97% credited to Author Wallet)
app.razorpay.key-id=${RAZORPAY_KEY_ID:rzp_test_YourKeyIdHere}
app.razorpay.key-secret=${RAZORPAY_KEY_SECRET:YourKeySecretHere}
app.razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:YOUR_RAZORPAY_WEBHOOK_SECRET}
app.razorpay.currency=INR

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}
 
# ---------------- Logging ----------------
logging.level.org.springframework.security=WARN
logging.level.com.contenthub=INFO

# ---------------- File storage (Cloudinary) ----------------
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:demo}
cloudinary.api-key=${CLOUDINARY_API_KEY:123456789}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:secret}



